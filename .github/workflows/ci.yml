name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Continuous Integration (Lint, Typecheck & Next.js Build)
  # -----------------------------------------------------------
  ci:
    name: Lint & Build with Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Build Next.js app
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # -----------------------------------------------------------
  # 2. Continuous Deployment (Deploy to Vercel Production)
  # -----------------------------------------------------------
  cd:
    name: Deploy to Vercel Production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice ::VERCEL_TOKEN secret is not configured in GitHub repository secrets. If you connected this repository directly in the Vercel dashboard, Vercel will automatically deploy on push to main."
          else
            echo "Installing dependencies..."
            bun install --frozen-lockfile

            echo "Pulling Vercel environment information..."
            bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

            echo "Building project artifacts with Vercel..."
            bunx vercel build --prod --token=$VERCEL_TOKEN

            echo "Deploying prebuilt artifacts to Vercel..."
            bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          fi
